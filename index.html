<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地質図検索 WebGIS | 産総研</title>

  <!-- Google Fonts: Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Leaflet.js v1.9.4 CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >

  <!-- Application CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-layout">
    <!-- モバイル用パネル切替バー（720px以下で表示） -->
    <nav id="mobile-nav-bar" class="mobile-nav-bar" aria-label="表示パネル切り替え">
      <button type="button" class="mobile-nav-btn is-active" data-mobile-view="map">地図</button>
      <button type="button" class="mobile-nav-btn" data-mobile-view="search">検索・一覧</button>
      <button type="button" id="mobile-legend-tab" class="mobile-nav-btn" data-mobile-view="legend" hidden>詳細・凡例</button>
    </nav>

    <!-- 左サイドバー：検索・年代マルチセレクト・表示中図幅・該当図幅一覧 -->
    <aside id="left-sidebar" class="sidebar sidebar-left" aria-label="図幅検索・フィルタ">
      <div class="sidebar-header">
        <div class="panel-title-group">
          <span class="panel-icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
              <line x1="8" y1="2" x2="8" y2="18"></line>
              <line x1="16" y1="6" x2="16" y2="22"></line>
            </svg>
          </span>
          <h1 id="app-title" class="panel-title">地質図検索</h1>
        </div>
        <div class="panel-header-actions">
          <div class="segmented-control lang-switch" role="group" aria-label="表示言語の切り替え">
            <button type="button" class="segmented-btn is-active" data-lang="ja">JP</button>
            <button type="button" class="segmented-btn" data-lang="en">EN</button>
          </div>
          <span id="result-count" class="result-badge" aria-live="polite">読込中...</span>
          <button
            type="button"
            id="fit-all-btn"
            class="icon-button subtle"
            title="表示中の全図幅にズーム"
            aria-label="表示中の全図幅にズーム"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="sidebar-body">
        <!-- テキスト検索 + サジェスト -->
        <div class="search-autocomplete">
          <div class="search-field">
            <span class="search-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>
            <input
              type="search"
              id="search-input"
              class="text-input"
              placeholder="図幅名または著者で検索"
              autocomplete="off"
              aria-label="図幅名または著者で検索"
              aria-autocomplete="list"
              aria-controls="search-suggestions"
              aria-expanded="false"
            >
            <kbd class="shortcut-hint" title="検索にフォーカス">/</kbd>
          </div>
          <ul id="search-suggestions" class="search-suggestions" role="listbox" hidden></ul>
        </div>

        <!-- 第一階層フィルター：地図種別 (map_type) -->
        <div class="filter-group">
          <span id="map-type-label" class="filter-label">地図種別</span>
          <div id="map-type-chips" class="decade-chips" role="group" aria-label="地図種別フィルタ"></div>
        </div>

        <!-- クイック表示オプション（地図範囲連動・図郭枠表示・全国シームレス） -->
        <div class="quick-toggles">
          <label class="toggle-chip-label">
            <input type="checkbox" id="viewport-only-toggle" class="toggle-checkbox">
            <span id="viewport-only-label">表示範囲内のみ</span>
          </label>
          <label class="toggle-chip-label">
            <input type="checkbox" id="show-index-toggle" class="toggle-checkbox" checked>
            <span id="show-index-label">図郭枠を表示</span>
          </label>
          <label class="toggle-chip-label">
            <input type="checkbox" id="seamless-200k-toggle" class="toggle-checkbox">
            <span id="seamless-200k-label">20万分の1 シームレス (全国WMS)</span>
          </label>
        </div>

        <!-- 折りたたみ式フィルター（発行年レンジ・縮尺・著者・その他） -->
        <section class="filter-accordion" aria-label="詳細フィルター">
          <div class="filter-accordion-header">
            <button
              type="button"
              id="toggle-filters-btn"
              class="filter-accordion-toggle"
              aria-expanded="false"
              aria-controls="filter-panel-body"
            >
              <span class="filter-toggle-title-group">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                </svg>
                <span id="filter-accordion-label">詳細フィルター</span>
                <span id="active-filter-badge" class="active-filter-badge" hidden>0</span>
              </span>
              <svg class="accordion-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>
            <button type="button" id="reset-filters" class="text-button" title="検索条件をリセット">
              リセット
            </button>
          </div>

          <div id="filter-panel-body" class="filter-panel-body" hidden>
            <!-- 発行年（デュアルレンジスライダー） -->
            <div class="filter-group">
              <div class="filter-label-row">
                <span id="decade-label" class="filter-label">発行年</span>
                <span id="year-range-display" class="year-range-display"></span>
              </div>
              <div class="dual-range-container">
                <div class="dual-range-track-bg"></div>
                <div id="year-range-track" class="dual-range-track-active"></div>
                <input
                  type="range"
                  id="year-range-min"
                  class="dual-range-input"
                  aria-label="開始年"
                >
                <input
                  type="range"
                  id="year-range-max"
                  class="dual-range-input"
                  aria-label="終了年"
                >
              </div>
            </div>

            <!-- 縮尺・シリーズマルチセレクト -->
            <div class="filter-group">
              <span id="scale-filter-label" class="filter-label">縮尺・シリーズ</span>
              <div id="scale-chips" class="decade-chips" role="group" aria-label="縮尺フィルタ"></div>
            </div>

            <!-- 地域・都道府県マルチセレクト -->
            <div class="filter-group">
              <span id="region-filter-label" class="filter-label">地域（複数選択可）</span>
              <div id="region-chips" class="decade-chips" role="group" aria-label="地域フィルタ"></div>
            </div>

            <!-- 著者マルチセレクト -->
            <div class="filter-group">
              <span id="author-filter-label" class="filter-label">著者（複数選択可）</span>
              <div id="author-chips" class="decade-chips author-chips" role="group" aria-label="著者フィルタ"></div>
            </div>

            <!-- その他の情報（発行機関・資料有無） -->
            <div class="filter-group">
              <span id="other-filter-label" class="filter-label">その他（発行機関・資料）</span>
              <div id="other-chips" class="decade-chips" role="group" aria-label="その他フィルタ"></div>
            </div>
          </div>
        </section>

        <!-- 背景地図切替 -->
        <div class="basemap-row" role="group" aria-label="背景地図の切り替え">
          <span id="basemap-label" class="filter-label">背景地図</span>
          <div class="segmented-control">
            <button type="button" class="segmented-btn is-active" data-basemap="pale">淡色</button>
            <button type="button" class="segmented-btn" data-basemap="std">標準</button>
            <button type="button" class="segmented-btn" data-basemap="photo">航空写真</button>
          </div>
        </div>

        <!-- 表示中の地質図オーバーレイ管理（最大4図幅） -->
        <div id="active-wms-bar" class="active-wms-bar" hidden>
          <div class="active-wms-header">
            <div class="active-wms-info">
              <span id="wms-status-dot" class="wms-dot" aria-hidden="true"></span>
              <span id="active-wms-name" class="active-wms-name">表示中の地質図 (0/4)</span>
            </div>
            <button
              type="button"
              id="clear-wms-btn"
              class="text-button"
              title="表示中の地質図をすべて閉じる"
              aria-label="表示中の地質図をすべて閉じる"
            >
              すべて閉じる
            </button>
          </div>

          <ul id="active-overlay-list" class="active-overlay-list"></ul>

          <div class="wms-opacity-row">
            <label id="opacity-label" class="wms-opacity-label" for="wms-opacity">透過度</label>
            <input
              type="range"
              id="wms-opacity"
              class="range-slider"
              min="0"
              max="100"
              value="85"
              aria-label="地質図の不透明度"
            >
            <span id="wms-opacity-value" class="wms-opacity-value">85%</span>
          </div>
        </div>

        <!-- エラー・ステータス通知用 -->
        <p id="status-message" class="status-message" role="status" hidden></p>

        <!-- 該当図幅一覧（常時表示） -->
        <div class="result-list-section">
          <div class="result-list-header">
            <span id="result-list-label" class="filter-label">該当図幅一覧</span>
          </div>
          <ul id="result-list" class="result-list"></ul>
        </div>
      </div>
    </aside>

    <!-- 中央マップエリア -->
    <main class="map-container">
      <div id="map" aria-label="地質図幅検索マップ"></div>
    </main>

    <!-- 右サイドバー：現在表示中の地質図のうち最も広い図幅の詳細情報＆凡例 -->
    <aside id="legend-sidebar" class="sidebar sidebar-right" aria-label="図幅詳細・地質凡例" hidden>
      <!-- 上段：最も広く表示されている図幅の詳細情報 -->
      <section id="dominant-info-section" class="dominant-info-section">
        <div class="sidebar-header dominant-info-header">
          <div class="legend-title-group">
            <span id="dominant-info-eyebrow" class="dominant-info-eyebrow">表示中の図幅詳細</span>
            <h2 id="dominant-info-title" class="legend-panel-title"></h2>
            <p id="dominant-info-subtitle" class="dominant-info-subtitle" hidden></p>
          </div>
        </div>
        <div class="dominant-info-body">
          <dl id="dominant-info-meta" class="dominant-info-meta"></dl>
          <div id="dominant-info-links" class="dominant-info-links"></div>
        </div>
      </section>

      <!-- 下段：地質凡例 / 地質断面図 -->
      <div class="sidebar-header legend-sidebar-header">
        <div class="legend-title-group">
          <h2 id="legend-panel-title" class="legend-panel-title">地質凡例</h2>
          <span id="legend-map-name" class="legend-map-name"></span>
        </div>
        <div class="legend-header-actions">
          <div id="visual-mode-tabs" class="segmented-control" role="tablist" aria-label="表示切り替え" hidden>
            <button type="button" id="tab-legend-btn" class="segmented-btn is-active" data-visual-mode="legend" role="tab" aria-selected="true">凡例</button>
            <button type="button" id="tab-section-btn" class="segmented-btn" data-visual-mode="section" role="tab" aria-selected="false">断面図</button>
          </div>
          <a
            id="legend-open-link"
            class="legend-external-link"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            title="新しいタブで拡大表示"
          >
            拡大
          </a>
        </div>
      </div>
      <div id="section-chips" class="section-chips" hidden></div>
      <div class="legend-sidebar-body">
        <div id="legend-zoom-wrapper" class="legend-zoom-wrapper">
          <img id="legend-image" class="legend-image" src="" alt="地質図凡例" loading="lazy">
          <div id="legend-loupe" class="legend-loupe" hidden aria-hidden="true"></div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Leaflet.js v1.9.4 JS -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <!-- Application JS -->
  <script src="js/app.js" defer></script>
</body>
</html>
